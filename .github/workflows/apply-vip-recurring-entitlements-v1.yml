name: Apply VIP Recurring Entitlements v1

on:
  push:
    branches:
      - feat/vip-recurring-entitlements-v1

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/vip-recurring-entitlements-v1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply deterministic integration patch
        run: node scripts/apply-vip-recurring-entitlements-v1.mjs
      - name: Commit integrated source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src package.json .github/workflows/ci.yml
          if git diff --cached --quiet; then
            echo "No integration changes to commit"
            exit 0
          fi
          git commit -m "Integrate VIP recurring voucher and gift issuance v1"
          git push origin HEAD:feat/vip-recurring-entitlements-v1
