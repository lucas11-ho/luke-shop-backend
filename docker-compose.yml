services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: luke_shop
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - luke_shop_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d luke_shop"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  luke_shop_pg:
