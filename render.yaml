services:
  - type: web
    name: luke-shop-backend
    runtime: docker
    healthCheckPath: /health/ready
    autoDeploy: false
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4100
      - key: TRUST_PROXY
        value: "true"
      - key: DATABASE_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: SERVICE_CREDENTIAL_PEPPER
        generateValue: true
      - key: CS_CONTEXT_SIGNING_SECRET
        generateValue: true
      - key: CS_SERVICE_SIGNING_SECRET
        generateValue: true
      - key: PAYMENT_CREDENTIAL_ENCRYPTION_KEY
        sync: false
      - key: PAYMENT_PUBLIC_BASE_URL
        sync: false
      - key: CUSTOMER_WEB_BASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: ASSET_STORAGE_DRIVER
        value: R2
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_PUBLIC_BASE_URL
        sync: false
